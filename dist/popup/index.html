<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="bar">
			<span class="logo" aria-hidden="true"></span>
			<strong>DS Colors</strong>
			<span class="spacer"></span>
			<select id="brand" aria-label="Brand"></select>
		</header>

		<div class="search">
			<label class="sbox">
				<span class="chip" aria-hidden="true"><i id="chip"></i></span>
				<input
					id="q"
					type="text"
					placeholder="Paste hex, box-shadow or token name"
					autocomplete="off"
					spellcheck="false"
					aria-label="Search"
				/>
				<button class="clear" id="clear" type="button" aria-label="Clear" hidden>✕</button>
			</label>
			<button class="iconbtn" id="pick" type="button" title="Pick a color from the screen" aria-label="Pick a color from the screen" hidden>
				<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
					<path
						d="M10.8 1.6a2 2 0 0 1 2.8 2.8l-1 1 .9.9a1 1 0 0 1 0 1.4l-.7.7a1 1 0 0 1-1.4 0l-.4-.4-4.3 4.3a2 2 0 0 1-1 .5l-2.4.5.5-2.4a2 2 0 0 1 .5-1L8.6 5.4l-.4-.4a1 1 0 0 1 0-1.4l.7-.7a1 1 0 0 1 1.4 0l.9.9 1-1Z"
						fill="none"
						stroke="currentColor"
						stroke-width="1.3"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
		</div>

		<main>
			<section class="blk" id="ansblk" hidden>
				<h2 class="lbl" id="anslbl">Result</h2>
				<div id="ans"></div>
			</section>

			<section class="blk">
				<div class="blk-head">
					<h2 class="lbl">Tokens</h2>
					<button class="fold" id="fold" type="button" aria-expanded="true" aria-controls="tokenbody" title="Hide tokens">
						<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
							<path
								d="M4 6.5 8 10.5l4-4"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
				</div>

				<div id="tokenbody">
					<div class="ctrls">
						<select id="group" aria-label="Token group"></select>
						<div class="modesw" role="group" aria-label="Color mode">
							<button type="button" id="mode-light" aria-pressed="true">Light</button>
							<button type="button" id="mode-dark" aria-pressed="false">Dark</button>
						</div>
					</div>
					<div class="rows" id="list"></div>
				</div>
			</section>
		</main>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script src="popup.js"></script>
	</body>
</html>
