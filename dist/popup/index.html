<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="bar">
			<strong>empeo Inspector</strong>
			<span class="env" id="env">—</span>
		</header>

		<div class="notice" id="blocked" hidden>
			<p>หน้านี้ไม่อยู่ในรายชื่อที่อนุญาต</p>
			<p class="hosts">localhost · portal.dev.empeo.com · portal.uat.empeo.com</p>
		</div>

		<main id="panel" hidden>
			<section>
				<button class="pick" type="button" id="toggle">เปิดโหมดส่อง</button>
				<p class="note">
					เปิดแล้วเอาเมาส์ชี้อะไรบนหน้าเว็บก็ได้ จะบอกว่าข้อมูลนั้นมาจาก API ไหน กี่แถว ใช้เวลาเท่าไหร่
					พร้อมปุ่มทำให้ว่างหรือเพิ่มแถวในป้ายเดียวกัน
				</p>
			</section>

			<section id="active" hidden>
				<h2>กำลังแกล้งอยู่</h2>
				<p class="current" id="current"></p>
				<button class="reset" type="button" id="reset">คืนค่าข้อมูลจริง</button>
			</section>
		</main>

		<script src="popup.js"></script>
	</body>
</html>
