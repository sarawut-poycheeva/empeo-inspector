<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="bar">
			<strong>empeo Inspector</strong>
			<span class="env" id="env">—</span>
		</header>

		<div class="blocked" id="blocked" hidden>
			<p>หน้านี้ไม่อยู่ในรายชื่อที่อนุญาต</p>
			<p class="hosts">localhost · portal.dev.empeo.com · portal.uat.empeo.com</p>
		</div>

		<main id="panel" hidden>
			<section>
				<h2>1 · แกล้งตรงไหน</h2>
				<ul class="scope" id="scope">
					<li>
						<button type="button" data-scope="" aria-pressed="true">
							<span class="path">ทั้งหน้า</span>
						</button>
					</li>
				</ul>
				<p class="note" id="scopeNote">ตัวเลขคือจำนวนแถวที่เจอใน response นั้น</p>
			</section>

			<section>
				<h2>2 · จำนวนแถว</h2>
				<div class="seg" id="rows">
					<button type="button" data-count="off" aria-pressed="true">ปิด</button>
					<button type="button" data-count="0">0</button>
					<button type="button" data-count="20">20</button>
					<button type="button" data-count="100">100</button>
					<button type="button" data-count="1000">1000</button>
				</div>
				<p class="note">กดแล้วหน้าเว็บจะโหลดใหม่ทันที</p>
			</section>
		</main>

		<script src="popup.js"></script>
	</body>
</html>
