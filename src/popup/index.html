<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header class="bar">
			<span class="logo" aria-hidden="true"></span>
			<strong>Dev Inspectors</strong>
			<span class="spacer"></span>
			<select id="brand" aria-label="Brand"></select>
		</header>

		<div class="lenses" role="tablist" aria-label="Lens">
			<button type="button" role="tab" id="lens-colors" aria-selected="true">Colors</button>
			<button type="button" role="tab" id="lens-icons" aria-selected="false">Icons</button>
		</div>

		<div class="search">
			<label class="sbox">
				<span class="chip" aria-hidden="true"><i id="chip"></i></span>
				<input
					id="q"
					type="text"
					placeholder="Paste hex, box-shadow or token name"
					autocomplete="off"
					spellcheck="false"
					aria-label="Search"
				/>
				<button class="clear" id="clear" type="button" aria-label="Clear" hidden>✕</button>
			</label>
			<button class="iconbtn" id="pick" type="button" title="Pick a color from the screen" aria-label="Pick a color from the screen" hidden>
				<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
					<path
						d="M10.8 1.6a2 2 0 0 1 2.8 2.8l-1 1 .9.9a1 1 0 0 1 0 1.4l-.7.7a1 1 0 0 1-1.4 0l-.4-.4-4.3 4.3a2 2 0 0 1-1 .5l-2.4.5.5-2.4a2 2 0 0 1 .5-1L8.6 5.4l-.4-.4a1 1 0 0 1 0-1.4l.7-.7a1 1 0 0 1 1.4 0l.9.9 1-1Z"
						fill="none"
						stroke="currentColor"
						stroke-width="1.3"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
		</div>

		<main>
			<!-- ===== Colors lens ===== -->
			<div id="panel-colors">
				<section class="blk" id="ansblk" hidden>
					<h2 class="lbl" id="anslbl">Result</h2>
					<div id="ans"></div>
				</section>

				<section class="blk">
					<div class="blk-head">
						<h2 class="lbl">Tokens</h2>
						<button class="fold" id="fold" type="button" aria-expanded="true" aria-controls="tokenbody" title="Hide tokens">
							<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
								<path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
							</svg>
						</button>
					</div>

					<div id="tokenbody">
						<div class="ctrls">
							<select id="group" aria-label="Token group"></select>
							<div class="modesw" role="group" aria-label="Color mode">
								<button type="button" id="mode-light" aria-pressed="true">Light</button>
								<button type="button" id="mode-dark" aria-pressed="false">Dark</button>
							</div>
						</div>
						<div class="rows" id="list"></div>
					</div>
				</section>
			</div>

			<!-- ===== Icons lens ===== -->
			<div id="panel-icons" hidden>
				<section class="blk">
					<div class="blk-head">
						<h2 class="lbl" id="iconlbl">Icons</h2>
						<div class="headtools">
							<div class="modesw" role="group" aria-label="Filter">
								<button type="button" id="ic-all" aria-pressed="true">All</button>
								<button type="button" id="ic-new" aria-pressed="false" disabled title="Icons added since you last marked the set as seen">
									New
								</button>
								<button type="button" id="ic-partial" aria-pressed="false" title="Only icons that are missing from at least one environment">
									Mismatched
								</button>
							</div>
							<div class="modesw viewsw" role="group" aria-label="View">
								<button type="button" id="view-cards" aria-pressed="true" title="Cards — name, codepoint and environments">
									<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
										<path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
									</svg>
								</button>
								<button type="button" id="view-grid" aria-pressed="false" title="Grid — glyphs only, for scanning the set">
									<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
										<path
											d="M2.5 2.5h4v4h-4zM9.5 2.5h4v4h-4zM2.5 9.5h4v4h-4zM9.5 9.5h4v4h-4z"
											fill="none"
											stroke="currentColor"
											stroke-width="1.4"
										/>
									</svg>
								</button>
							</div>
							<button class="syncbtn" id="refresh" type="button" title="Fetch every environment again, bypassing the cache">
								Sync
								<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
									<path
										d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.4 2.2v3h-3"
										fill="none"
										stroke="currentColor"
										stroke-width="1.5"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
						</div>
					</div>
					<div id="envline" class="envline"></div>
					<div class="icongrid" id="icongrid"></div>
					<div class="idle" id="iconidle">Loading…</div>
				</section>
			</div>
		</main>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script src="popup.js"></script>
	</body>
</html>
